server {
    listen 80;
    listen [::]:80;
    server_name digitalbuilders.in www.digitalbuilders.in;

    root /var/www/DigitalBuilders/public;
    index index.php index.html;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/DigitalBuilders/public;
    }

    # Logging
    access_log /var/log/nginx/digitalbuilders_access.log;
    error_log  /var/log/nginx/digitalbuilders_error.log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Fast Static Asset Caching with Vite Hashing
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pass all requests to Laravel Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Configuration (PHP 8.3 on port 18000)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:18000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 600;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Deny direct access to sensitive directories
    location ~* ^/(storage|bootstrap/cache)/ {
        deny all;
    }

    client_max_body_size 25M;
}
